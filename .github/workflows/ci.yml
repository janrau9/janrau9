name: CI

# Every branch lives in this repo, so a push trigger covers branches and pull requests alike.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Fails the build on invalid cv.yaml or case studies.
      - run: pnpm validate
      # Fails if cv.schema.json is out of date with the Zod schema.
      - run: pnpm schema:check
      # Fails if README.md (the GitHub profile) is out of date with cv.yaml.
      - run: pnpm readme:check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
