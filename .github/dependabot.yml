# Weekly dependency updates, grouped so a week's changes arrive as at most two pull requests,
# each tested by CI like any other branch. Nothing merges on its own.
version: 2
updates:
  - package-ecosystem: npm # covers pnpm workspaces and pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
