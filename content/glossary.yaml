# Tech terms visitors ask about, for elevator mode. Every claim cites cv.yaml:
#   have      used in shipped or tested work; `evidence` lists cv.yaml ids (or lang:<Name>)
#   adjacent  not used, but close work exists; `near` lists terms I have
#   not-yet   no close work; `near` lists the nearest terms I have
# Aliases are the spellings people type; matching is case-insensitive.
# Validated by packages/schema (every id resolves) on every build.

