# Questions recruiters ask that ranking answers badly, each with a curated answer for
# elevator mode. A visitor's question that comes close to one of these (or its phrasings)
# gets this answer pinned first, with the ranked passages under "See more".
#   quotes        the cited passages, in this order
#   words         my own words, with the cited passages underneath as proof
#   conversation  "I'd rather answer this in a conversation" and my email
# A citation is a cv.yaml id, or a heading plus the passage's opening words
# ("work:slash#outcome › Delivery: about"), since prose passages are numbered by position.
# Validated on every build: ids resolve, and every cited passage exists in the index.

questions:

  # Behavioural
  - id: failure
    question: "Tell me about a time you failed"
    phrasings:
      - "What's a mistake you made at work?"
      - "Tell me about something that went wrong"
      - "Have you ever shipped a bug to production?"
    answer: quotes
    cite:
      - "work:slash#incident-tournament-pins-reached-every-phone › A test I added for the"
      - "work:slash#incident-tournament-pins-reached-every-phone › I fixed it at the source"
      - "work:synchd#security-fix-authorizing-from-the-stored-row › A security review on 2026-08-03 found"
      - "work:this-site#what-the-guardrails-caught › A signal that could never fire."
  - id: conflict
    question: "How do you handle disagreement with a teammate?"
    phrasings:
      - "Tell me about a conflict at work"
      - "What do you do when you disagree with your manager?"
      - "How do you resolve disagreements in a team?"
    answer: words
    words: "I discuss the conflict until we agree on a solution, and then I wholeheartedly support that decision."
